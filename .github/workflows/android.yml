name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "site/**"
      - "src/**"
      - "scripts/build.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the wallpaper page and bundle it
        run: |
          node scripts/build.mjs
          mkdir -p android/app/src/main/assets
          cp site/wallpaper.html android/app/src/main/assets/wallpaper.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble the debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk orbit-wallpaper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-wallpaper-apk
          path: orbit-wallpaper.apk
          if-no-files-found: error

      - name: Publish it as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          body: |
            Debug-signed build of Orbit Wallpaper, rebuilt from `main`.
            Install it, open it, paste a wallpaper link from the Studio, then tap Set wallpaper.
          files: orbit-wallpaper.apk
          make_latest: true
