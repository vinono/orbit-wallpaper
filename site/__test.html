<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" style="width:500px;height:1083px"></canvas>
<div id="r"></div>
<pre id="log"></pre>
<script type="module">
import { createClock } from "./assets/clock.js";
const log = [];
const clock = createClock({ canvas: document.getElementById("c"), readout: document.getElementById("r"), config: { form: "dial", fps: 1, radius: 0.26 } });
const t0 = performance.now();
log.push("hidden=" + document.hidden + " now0=" + t0.toFixed(0));
clock.start();
const ctx = document.getElementById("c").getContext("2d");
function sample(tag) {
  const d = ctx.getImageData(0, 0, 500, 1083).data;
  let n = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i] + d[i+1] + d[i+2] > 30) n++;
  log.push(tag + " t=" + (performance.now()-t0).toFixed(0) + " lit=" + n);
  document.getElementById("log").textContent = log.join("\n");
}
setTimeout(() => sample("2500ms"), 2500);
setTimeout(() => sample("6000ms"), 6000);
</script></body></html>
