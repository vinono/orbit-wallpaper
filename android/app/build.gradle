plugins {
    id "com.android.application"
}

android {
    namespace "com.github.vinono.orbitwallpaper"
    compileSdk 34

    defaultConfig {
        applicationId "com.github.vinono.orbitwallpaper"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
